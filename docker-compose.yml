version: "3.9"

services:
  auth-service:
    build: .
    container_name: auth-service
    command: npm run dev:auth
    ports:
      - "5001:5001"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules

  user-service:
    build: .
    container_name: user-service
    command: npm run dev:user
    ports:
      - "5002:5002"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules

  formbuilder-service:
    build: .
    container_name: formbuilder-service
    command: npm run dev:formbuilder
    ports:
      - "5003:5003"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - /app/node_modules

  contest-management:
    build: .
    container_name: contest-management-service
    command: npm run dev:contestmanagement
    ports:
      - "5004:5004"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - /app/node_modules

  # server db port 5432
  # db:
  #   image: postgres:16
  #   container_name: launchpad-db
  #   restart: always
  #   env_file:
  #     - .env
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

  # local db port 5433
  db:
    image: postgres:16
    container_name: launchpad-db
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
